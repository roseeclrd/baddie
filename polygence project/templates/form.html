<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Leave a Review</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /* BODY + PAGE CENTER */
 html, body {
    margin: 0;
    width: 100%;
    min-height: 100vh;
    background: #eac6d257;
    font-family: 'Montserrat', sans-serif;
    color: #824f2b;
    box-sizing: border-box;
}

        .page-center {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100%;
            padding: 20px;
        }

        /* FORM WRAPPER (pink card) */
        .form-wrapper {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 20px;
            padding: 20px 50px;
            width: 100%;
            max-width: 500px; /* comfortable width */
            box-shadow: 0 14px 35px rgba(236, 170, 182, 0.45);
        }

        /* HEADER */
        .form-wrapper h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #824f2b;
            font-weight: 700;
        }

        /* FORM FIELDS */
        .form-wrapper form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-wrapper input,
        .form-wrapper textarea,
        .form-wrapper select {
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid #f5c5cd76;
            font-size: 15px;
            background: #fff;
            outline: none;
            color: #824f2b;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-wrapper input:focus,
        .form-wrapper textarea:focus,
        .form-wrapper select:focus {
            border-color: #f5c5cd76;
            box-shadow: 0 0 0 3px rgba(236, 170, 182, 0.25);
        }

        .form-wrapper textarea {
            resize: none;
            min-height: 120px;
        }

        /* SUBMIT BUTTON */
        .form-wrapper button {
            margin-top: 10px;
            padding: 12px;
            border-radius: 14px;
            border: none;
            background: #f5c5cd76;
            color: #824f2b;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .form-wrapper button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(236, 170, 182, 0.5);
        }

    </style>
</head>
<body>
    <div class="page-center">
        <div class="form-wrapper">
            <h2>Leave your review</h2>
          <form action="/submit" method="POST">
    <input type="text" name="street" placeholder="Street name" required>
    <input type="text" name="city" placeholder="City" required>
    <input type="text" name="state" placeholder="State" required>

    <select name="country" required>
        <option value="">Select country</option>
        <option value="USA">USA</option>
        <option value="UK">UK</option>
        <option value="Canada">Canada</option>
        <option value="Kazakhstan">Kazakhstan</option>
        <option value="Germany">Germany</option>
        <option value="France">France</option>
        <option value="Other">Other</option>
    </select>


    <select name="rating" id="rating" required>
        <option value="" disabled selected>Select rating</option>
        <option value="1">1 - Highly Unsafe</option>
        <option value="2">2 - Moderately Unsafe</option>
        <option value="3">3 - Safe</option>
        <option value="4">4 - Very Safe</option>
        <option value="5">5 - Extremely Safe</option>
    </select>

    <textarea name="review" placeholder="Your review" required></textarea>

    <button type="submit">Submit Review</button>
</form>
        </div>
    </div>
</body>
</html>
