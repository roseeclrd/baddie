<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Users / Reviews</title>
    <style>
        body {
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            background: #eac6d257;
            color: #824f2b;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        h1 {
            margin-top: 40px;
            margin-bottom: 30px;
        }

        /* Country filter */
        form {
            width: 220px;
            margin: 0 auto 40px auto;
        }

        select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid #f7dbe18e;
            font-size: 15px;
            outline: none;
        }

        /* Container for review cards */
        .reviews-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 600px;
            margin: 0 auto 60px auto;
        }

        /* Review card style */
        .review-card {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 20px;
            padding: 20px 30px;
            box-shadow: 0 14px 35px rgba(236, 170, 182, 0.45);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            text-align: left;
        }

        .review-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 40px rgba(236, 170, 182, 0.55);
        }

        .review-card p {
            margin: 6px 0;
            line-height: 1.5;
        }

        .review-card strong {
            font-weight: 700;
        }

        .no-reviews {
            font-style: italic;
            color: #824f2b;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<h1>Experiences</h1>

<!-- Category filter -->
<form method="GET">
    <select name="category" onchange="this.form.submit()">
        {% for cat in categories %}
            <option value="{{ cat }}" {% if cat == selected_category %}selected{% endif %}>
                {{ cat }}
            </option>
        {% endfor %}
    </select>
</form>

<div class="reviews-container">
    {% for exp in experience %}
        <div class="review-card">
            <p class="review-category">{{ exp.category }}</p>
            <p class="review-text">{{ exp.textExp }}</p>
        </div>
    {% else %}
        <p style="text-align:center;">No experiences found.</p>
    {% endfor %}
</div>

</body>
</html>
